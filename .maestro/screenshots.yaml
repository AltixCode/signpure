appId: com.altixcode.signpure
name: Store screenshots
---
# Shows the vault with a real signature in it and the editor over the real
# fixture, rather than an empty document picker.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-hero

- tapOn: ".*Signature Vault.*"
- extendedWaitUntil:
    visible: ".*New Signature.*"
    timeout: 25000
- tapOn: ".*New Signature.*"
- extendedWaitUntil:
    visible: ".*Save to Vault.*"
    timeout: 20000
# Steep diagonals: long horizontal swipes trigger the navigator's interactive
# pop, and a fast swipe leaves too little ink to read as a signature.
#
# The vertical band is substituted by the runner rather than written here. The
# canvas sits at 31-47% of the screen on a 6.9" phone and at 18-29% on a 13"
# iPad -- the two do not overlap, so any single pair of numbers draws outside
# the canvas on one of them. A swipe that lands outside still reports success,
# which is how the phone set shipped with a signature pad holding one stray
# tick mark.
#
# Placeholders rather than ${...}: Maestro validates a point against a literal
# "N%,N%" at parse time, so an interpolated variable fails to parse.
- swipe:
    start: "22%,__SIGN_TOP__%"
    end: "28%,__SIGN_BOTTOM__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "28%,__SIGN_BOTTOM__%"
    end: "34%,__SIGN_TOP__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "34%,__SIGN_TOP__%"
    end: "40%,__SIGN_BOTTOM__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "40%,__SIGN_BOTTOM__%"
    end: "46%,__SIGN_TOP__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "46%,__SIGN_TOP__%"
    end: "52%,__SIGN_BOTTOM__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "52%,__SIGN_BOTTOM__%"
    end: "58%,__SIGN_TOP__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "58%,__SIGN_TOP__%"
    end: "64%,__SIGN_BOTTOM__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "64%,__SIGN_BOTTOM__%"
    end: "70%,__SIGN_TOP__%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: "70%,__SIGN_TOP__%"
    end: "76%,__SIGN_BOTTOM__%"
    duration: 400
- takeScreenshot: 02-vault
- tapOn: ".*Save to Vault.*"
- extendedWaitUntil:
    visible: ".*SAVED SIGNATURES.*1.*"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 03-saved
