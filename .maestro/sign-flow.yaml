appId: com.altixcode.signpure
name: Sign a document end to end
---
# The fixture is A4 with a signature rule at a known position (y=200, x 60-300
# in PDF points), so the export can be checked for a mark in the right place
# rather than eyeballed. The build this replaces drew a mock contract and never
# embedded the signature at all.
# clearState so the run does not inherit state from a previous one. A failed
# run can leave the system document picker presented, and it survives a plain
# relaunch -- the next run then drives the vault steps against the picker.
- launchApp:
    clearState: true
# `expo run:ios` launches through the dev-client deep link even for a Release
# build, and the resulting "Open in ..." alert covers the accessibility tree.
# Settle first so the conditional sees it rather than racing the launch.
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Open in .*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "On My iPhone"
    commands:
      - tapOn:
          point: "354,101"
      - waitForAnimationToEnd:
          timeout: 4000
- assertVisible: "Private Document Signing"

# Draw a signature into the vault first; placing one without it is now blocked.
- tapOn: ".*Signature Vault.*"
- extendedWaitUntil:
    visible: ".*(Vault|Signature).*"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: artifacts/01-vault

- tapOn: ".*New Signature.*"
- extendedWaitUntil:
    visible: ".*(Draw|Clear|Save|Sign).*"
    timeout: 20000
- takeScreenshot: artifacts/02-pad

# The pad is inline in the vault screen; its canvas spans roughly 34-51% of
# the screen height. Swiping below that lands on the Clear/Save row and can
# trigger the scroll view's interactive pop instead of drawing.
# Slow, overlapping strokes. A fast swipe yields very few touch samples, so the
# pad recorded a single short tick from three full-width gestures -- enough to
# look like a signature on screen but far too little ink to prove anything in
# the exported PDF.
# A zigzag of steep diagonals, drawn slowly.
#
# Two constraints, both learned the hard way. Long mostly-horizontal swipes
# trigger the navigator's interactive pop: the flow silently returned to the
# home screen mid-signature and a later stroke landed on the document card,
# opening the file picker. And a fast swipe yields very few touch samples, so
# three full-width gestures recorded a single short tick -- enough to look like
# a signature on screen, far too little ink to prove anything in the export.
- swipe:
    start: "26%,37%"
    end: "30%,49%"
    duration: 900
- swipe:
    start: "30%,49%"
    end: "34%,37%"
    duration: 900
- swipe:
    start: "34%,37%"
    end: "38%,49%"
    duration: 900
- swipe:
    start: "38%,49%"
    end: "42%,37%"
    duration: 900
- swipe:
    start: "42%,37%"
    end: "46%,49%"
    duration: 900
- swipe:
    start: "46%,49%"
    end: "50%,37%"
    duration: 900
- swipe:
    start: "50%,37%"
    end: "54%,49%"
    duration: 900
- swipe:
    start: "54%,49%"
    end: "58%,37%"
    duration: 900
- swipe:
    start: "58%,37%"
    end: "62%,49%"
    duration: 900
- swipe:
    start: "62%,49%"
    end: "66%,37%"
    duration: 900
- swipe:
    start: "66%,37%"
    end: "70%,49%"
    duration: 900
- swipe:
    start: "70%,49%"
    end: "74%,37%"
    duration: 900
- tapOn: ".*Save to Vault.*"
- extendedWaitUntil:
    visible: ".*SAVED SIGNATURES.*1.*"
    timeout: 25000
- takeScreenshot: artifacts/04-saved

# Back to the document, open the fixture, and place the signature on the rule.
- tapOn: ".*Back.*"
- extendedWaitUntil:
    visible: ".*Select PDF Document.*"
    timeout: 20000
- tapOn: ".*Select PDF Document.*"
- extendedWaitUntil:
    visible: ".*(Browse|Recents|Files|On My iPhone).*"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 8000
# The picker opens on Recents, which is empty on a fresh simulator; the fixture
# lives under On My iPhone.
- runFlow:
    when:
      visible: "No Recents"
    commands:
      - tapOn: "Browse"
      - waitForAnimationToEnd:
          timeout: 6000
      - runFlow:
          when:
            visible: "On My iPhone"
          commands:
            - tapOn: "On My iPhone"
            - waitForAnimationToEnd:
                timeout: 6000
# Tap the thumbnail, not the filename. A tap on the label reports COMPLETED and
# leaves the picker open; the cell's hit target is the icon above it. The grid
# holds exactly one file, so its position is fixed.
- tapOn:
    point: "71,242"

# Maestro matches text case-insensitively, so ".*(Sign|Date|Text|Check).*" was
# satisfied by the filename "signpure-fixture" while the picker was still open:
# the assertion passed before the editor existed. Anchor on the page canvas,
# which only the editor has.
- extendedWaitUntil:
    visible: ".*Tap the page to place.*"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/05-editor

# Place the signature on the rule. The fixture puts that rule at PDF y=200,
# x 60-300 (origin bottom-left); rendered at this size the line sits at roughly
# (127, 628) in the 402x874 viewport. verify-signed-pdf.sh checks the export for
# ink inside that rule, so a tap landing anywhere else fails the gate rather
# than quietly producing a signed-looking file.
- tapOn:
    point: "127,626"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/06-placed

- tapOn: "Export"
# Sharing.shareAsync presents the system share sheet once the file is written.
- extendedWaitUntil:
    visible: ".*(Close|Cancel|AirDrop|Copy).*"
    timeout: 60000
- takeScreenshot: artifacts/07-exported
