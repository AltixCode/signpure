name: Build, Release & Store Submission Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit_to_stores:
        description: 'Automatically submit to TestFlight / Play Store'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: iOS Build & Package
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      app_name: ${{ steps.version.outputs.app_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      app_build: ${{ steps.version.outputs.app_build }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Workspace
        run: rm -rf build ios android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Compute Dynamic Version & Bump app.json
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name)")
          APP_VERSION="1.0.$COMMIT_COUNT"
          APP_BUILD="$COMMIT_COUNT"
          TAG_NAME="v$APP_VERSION"

          echo "Computed Version: $APP_NAME $APP_VERSION (Build $APP_BUILD, Tag $TAG_NAME)"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = "'"$APP_VERSION"'";
            app.expo.ios = app.expo.ios || {};
            app.expo.ios.buildNumber = "'"$APP_BUILD"'";
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = parseInt("'"$APP_BUILD"'", 10);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log("Updated app.json to version", app.expo.version, "build", app.expo.ios.buildNumber);
          '

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build & Export Signed iOS IPA
        run: |
          mkdir -p build/output
          SCHEME=$(ls ios | grep .xcodeproj | head -n 1 | sed 's/.xcodeproj//')
          echo "Building iOS Scheme: $SCHEME"

          AUTH_KEY="/Users/ata/Certificates/AuthKey_NGDJQCGYXQ.p8"
          if [ -f "$AUTH_KEY" ]; then
            echo "Archiving with App Store Connect API Key..."
            xcodebuild archive \
              -workspace "ios/${SCHEME}.xcworkspace" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/${SCHEME}.xcarchive" \
              -derivedDataPath "build/DerivedData" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$AUTH_KEY" \
              -authenticationKeyID "NGDJQCGYXQ" \
              -authenticationKeyIssuerID "c7e17516-b80c-42fe-a192-229b4cee0a48" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEVELOPMENT_TEAM="8Q8Y559285"
          else
            echo "Archiving with local signing..."
            xcodebuild archive \
              -workspace "ios/${SCHEME}.xcworkspace" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/${SCHEME}.xcarchive" \
              -derivedDataPath "build/DerivedData" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEVELOPMENT_TEAM="8Q8Y559285"
          fi

          cat << 'PLIST_EOF' > build/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>8Q8Y559285</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST_EOF

          if [ -f "$AUTH_KEY" ]; then
            xcodebuild -exportArchive \
              -archivePath "build/${SCHEME}.xcarchive" \
              -exportPath "build/output" \
              -exportOptionsPlist "build/exportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$AUTH_KEY" \
              -authenticationKeyID "NGDJQCGYXQ" \
              -authenticationKeyIssuerID "c7e17516-b80c-42fe-a192-229b4cee0a48"
          else
            xcodebuild -exportArchive \
              -archivePath "build/${SCHEME}.xcarchive" \
              -exportPath "build/output" \
              -exportOptionsPlist "build/exportOptions.plist"
          fi

          RAW_IPA=$(find build/output -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$RAW_IPA" ] && [ -f "$RAW_IPA" ]; then
            cp "$RAW_IPA" "build/output/${APP_NAME}-${APP_VERSION}.ipa"
            echo "Successfully generated IPA at build/output/${APP_NAME}-${APP_VERSION}.ipa"
          else
            echo "Warning: No IPA generated in build/output"
          fi

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit_to_stores == true }}
        run: |
          API_KEY_PATH="/Users/ata/Certificates/app_store_connect_api_key.json"
          TARGET_IPA=$(find build/output -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -f "$API_KEY_PATH" ] && [ -n "$TARGET_IPA" ] && [ -f "$TARGET_IPA" ]; then
            echo "Uploading $TARGET_IPA to TestFlight via Fastlane Pilot..."
            fastlane pilot upload --ipa "$TARGET_IPA" --api_key_path "$API_KEY_PATH" --skip_waiting_for_build_processing true
          fi

      - name: Stash iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: build/output/*.ipa
          if-no-files-found: ignore

  build-android:
    name: Android Build & Package
    if: ${{ always() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android') && (needs.build-ios.result == 'success' || inputs.platform == 'android') }}
    needs: build-ios
    runs-on: [self-hosted, linux, x64]
    outputs:
      app_name: ${{ steps.version.outputs.app_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      app_build: ${{ steps.version.outputs.app_build }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Workspace
        run: rm -rf build ios android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Compute Dynamic Version & Bump app.json
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name)")
          APP_VERSION="1.0.$COMMIT_COUNT"
          APP_BUILD="$COMMIT_COUNT"
          TAG_NAME="v$APP_VERSION"

          echo "Computed Version: $APP_NAME $APP_VERSION (Build $APP_BUILD, Tag $TAG_NAME)"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = "'"$APP_VERSION"'";
            app.expo.ios = app.expo.ios || {};
            app.expo.ios.buildNumber = "'"$APP_BUILD"'";
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = parseInt("'"$APP_BUILD"'", 10);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log("Updated app.json to version", app.expo.version, "build", app.expo.android.versionCode);
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK & AAB
        run: |
          mkdir -p build/output
          cd android
          echo "Building Release APK..."
          ./gradlew assembleRelease --stacktrace
          echo "Building Release AAB Bundle..."
          ./gradlew bundleRelease --stacktrace
          cd ..

          RAW_APK=$(find android/app/build/outputs/apk -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
            cp "$RAW_APK" "build/output/${APP_NAME}-${APP_VERSION}.apk"
            echo "Successfully generated APK at build/output/${APP_NAME}-${APP_VERSION}.apk"
          fi

          RAW_AAB=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$RAW_AAB" ] && [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" "build/output/${APP_NAME}-${APP_VERSION}.aab"
            echo "Successfully generated AAB at build/output/${APP_NAME}-${APP_VERSION}.aab"
          fi

      - name: Upload to Google Play Store
        if: ${{ github.event_name == 'push' || inputs.submit_to_stores == true }}
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          SERVICE_KEY=""
          if [ -n "${PLAY_STORE_SERVICE_ACCOUNT_JSON:-}" ]; then
            SERVICE_KEY="$RUNNER_TEMP/play-store-service-account.json"
            printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$SERVICE_KEY"
          fi
          TARGET_AAB="build/output/${APP_NAME}-${APP_VERSION}.aab"
          PKG_NAME=$(node -e "console.log(require('./app.json').expo.android.package)")

          if [ -f "$TARGET_AAB" ] && [ -f "$SERVICE_KEY" ]; then
            echo "Uploading $TARGET_AAB to Google Play internal test track for package: $PKG_NAME..."
            gplay release \
              --package "$PKG_NAME" \
              --bundle "$TARGET_AAB" \
              --track internal \
              --service-account-json "$SERVICE_KEY" \
              --commit
          else
            echo "::warning::Google Play upload skipped: PLAY_STORE_SERVICE_ACCOUNT_JSON or AAB is unavailable."
          fi

      - name: Stash Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/output/*.apk
            build/output/*.aab
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: [build-ios, build-android]
    if: always() && (needs.build-ios.result == 'success' || needs.build-android.result == 'success')
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Stashed Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/downloaded

      - name: Prepare Release Packages & Checksums
        id: prep
        run: |
          mkdir -p build/output
          find build/downloaded -type f \( -name "*.ipa" -o -name "*.apk" -o -name "*.aab" \) -exec cp {} build/output/ \;

          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name)")
          APP_VERSION="1.0.$COMMIT_COUNT"
          APP_BUILD="$COMMIT_COUNT"
          TAG_NAME="v$APP_VERSION"

          cd build/output
          shasum -a 256 *.ipa *.apk *.aab > SHA256SUMS.txt 2>/dev/null || true
          cd ../..

          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 12)
          REPO="${{ github.repository }}"

          cat << EOF > RELEASE_NOTES.md
          ## 🚀 ${APP_NAME} ${TAG_NAME} (Build ${APP_BUILD})

          ### 📦 Direct Download Packages
          | Package | Description | Target Platform / Architecture | Direct Download Link |
          |:---|:---|:---|:---|
          EOF

          if [ -f "build/output/${APP_NAME}-${APP_VERSION}.ipa" ]; then
            echo "| **\`${APP_NAME}-${APP_VERSION}.ipa\`** | Signed iOS Application Archive | iOS 15.0+ (TestFlight / Sideloading / AltStore) | [Download ${APP_NAME}-${APP_VERSION}.ipa](https://github.com/${REPO}/releases/download/${TAG_NAME}/${APP_NAME}-${APP_VERSION}.ipa) |" >> RELEASE_NOTES.md
          fi

          if [ -f "build/output/${APP_NAME}-${APP_VERSION}.apk" ]; then
            echo "| **\`${APP_NAME}-${APP_VERSION}.apk\`** | Standalone Universal APK (Recommended) | All Android Devices | [Download ${APP_NAME}-${APP_VERSION}.apk](https://github.com/${REPO}/releases/download/${TAG_NAME}/${APP_NAME}-${APP_VERSION}.apk) |" >> RELEASE_NOTES.md
          fi

          if [ -f "build/output/${APP_NAME}-${APP_VERSION}.aab" ]; then
            echo "| **\`${APP_NAME}-${APP_VERSION}.aab\`** | Google Play App Bundle | Android Play Store Distribution | [Download ${APP_NAME}-${APP_VERSION}.aab](https://github.com/${REPO}/releases/download/${TAG_NAME}/${APP_NAME}-${APP_VERSION}.aab) |" >> RELEASE_NOTES.md
          fi

          cat << EOF >> RELEASE_NOTES.md

          ### 🛡️ Privacy & Architecture Highlights
          - **100% On-Device Processing**: No cloud servers, no remote accounts, and zero telemetry.
          - **Anti-Subscription Promise**: Single lifetime non-consumable license. Own it forever with zero recurring fees.
          - **12-Language Support**: Fully localized in English, Spanish, French, German, Russian, Chinese, Japanese, Portuguese, Korean, Italian, Turkish, and Arabic.

          ### 📝 Recent Changes
          ${CHANGELOG}

          ### 🔒 Binary Integrity (SHA-256)
          \`\`\`text
          $(cat build/output/SHA256SUMS.txt 2>/dev/null || echo "No checksums generated")
          \`\`\`
          EOF

          # Clean leading spaces in RELEASE_NOTES.md lines
          sed -i -e 's/^[ \t]*##/##/' RELEASE_NOTES.md
          sed -i -e 's/^[ \t]*###/###/' RELEASE_NOTES.md
          sed -i -e 's/^[ \t]*- /- /' RELEASE_NOTES.md

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v gh >/dev/null 2>&1 || brew install gh

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists - updating notes and assets."
            gh release edit "$TAG_NAME" \
              --title "${APP_NAME} ${TAG_NAME} (Build ${APP_BUILD})" \
              --notes-file RELEASE_NOTES.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            echo "Creating release $TAG_NAME."
            gh release create "$TAG_NAME" \
              --title "${APP_NAME} ${TAG_NAME} (Build ${APP_BUILD})" \
              --notes-file RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

          FILES=()
          for f in build/output/*.ipa build/output/*.apk build/output/*.aab build/output/SHA256SUMS.txt; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "Uploading ${#FILES[@]} artifacts to release $TAG_NAME..."
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
          else
            echo "Warning: No release artifacts found to upload."
          fi

      - name: Tag Git Commit
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi
