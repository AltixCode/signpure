name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: EAS Build & Submit
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build & Submit iOS
        if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          if [ "$PROFILE" = "production" ]; then
            eas build --platform ios --profile production --auto-submit --non-interactive
          else
            eas build --platform ios --profile "$PROFILE" --non-interactive
          fi
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Build & Submit Android
        if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          if [ "$PROFILE" = "production" ]; then
            eas build --platform android --profile production --auto-submit --non-interactive
          else
            eas build --platform android --profile "$PROFILE" --non-interactive
          fi
